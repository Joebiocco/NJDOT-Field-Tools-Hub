<!--
  Field Tools Hub new-page template

  Contents
  1. Copy/use rules
  2. Required head and pre-paint theme
  3. Shared shell markup
  4. Page content scaffold
  5. Accessible dialog and toast
  6. Transition cleanup and page script

  This is a documentation template. Copy it to pages/<tool>.html and replace
  every TODO. Read docs/ui-style-guide.md, docs/protected-areas.md, and
  docs/qa-checklist.md before using it.
-->
<!DOCTYPE html>
<html lang="en">
<head>
  <!-- 1. Required metadata and shared shell -->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#1e2939">
  <title>TODO — Field Tools Hub</title>
  <link rel="manifest" href="../manifest.json">
  <link rel="stylesheet" href="../css/field-ui.css">
  <script>
    /* 2. Pre-paint theme: read only; index.html owns the preference. */
    try {
      if (localStorage.getItem('field_dark_mode') === '1') {
        document.documentElement.setAttribute('data-dark', '');
      }
    } catch (_) {}
  </script>
  <style>
    /*
      3. Page-local tokens only. Keep the shared shell in field-ui.css.
      Do not add transition: all or persistent body transforms.
    */
    :root {
      --page-bg: var(--bg, #eef0f4);
      --page-surface: var(--surface, #fff);
      --page-text: var(--text, #111827);
      --page-muted: var(--muted, #6b7280);
      --page-border: var(--border, #d1d9e0);
    }
    html { background: var(--page-bg); }
    body {
      margin: 0;
      background: var(--page-bg);
      color: var(--page-text);
      font-family: Inter, system-ui, -apple-system, Arial, sans-serif;
    }
    .page-wrap {
      width: min(1120px, calc(100% - 32px));
      margin: 0 auto;
      padding: 24px 0 48px;
    }
    .page-intro {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 18px;
      margin-bottom: 20px;
    }
    .page-intro h1 { margin: 0; font-size: clamp(1.5rem, 3vw, 2.2rem); }
    .page-intro p { margin: 8px 0 0; color: var(--page-muted); }
    .ft-eyebrow {
      margin: 0 0 6px;
      color: var(--page-muted);
      font-size: .72rem;
      font-weight: 800;
      letter-spacing: .12em;
      text-transform: uppercase;
    }
    .surface {
      background: var(--page-surface);
      border: 1px solid var(--page-border);
      border-radius: 10px;
      padding: 20px;
    }
    .surface + .surface { margin-top: 16px; }
    .actions { display: flex; flex-wrap: wrap; gap: 10px; }
    .button {
      min-height: 44px;
      padding: 0 16px;
      border: 1px solid var(--page-border);
      border-radius: 8px;
      background: var(--page-surface);
      color: var(--page-text);
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }
    .button-primary {
      border-color: #1a56db;
      background: #1a56db;
      color: #fff;
    }
    .button:focus-visible {
      outline: 3px solid #e5b33b;
      outline-offset: 2px;
      box-shadow: 0 0 0 3px rgba(26,86,219,.25);
    }
    .field { display: grid; gap: 6px; max-width: 520px; }
    .field label { font-weight: 700; }
    .field input, .field select, .field textarea {
      min-height: 44px;
      box-sizing: border-box;
      width: 100%;
      padding: 9px 11px;
      border: 1px solid var(--page-border);
      border-radius: 8px;
      background: var(--page-surface);
      color: var(--page-text);
      font: inherit;
    }
    .field textarea { min-height: 110px; resize: vertical; }
    .dialog-backdrop {
      position: fixed;
      inset: 0;
      z-index: 1050;
      display: grid;
      place-items: center;
      padding: calc(24px + env(safe-area-inset-top, 0px))
               calc(16px + env(safe-area-inset-right, 0px))
               calc(24px + env(safe-area-inset-bottom, 0px))
               calc(16px + env(safe-area-inset-left, 0px));
      background: rgba(4, 12, 26, .58);
    }
    .dialog-backdrop[aria-hidden="true"] { display: none; }
    .dialog {
      width: min(520px, 100%);
      max-height: calc(100dvh - 48px - env(safe-area-inset-top, 0px)
        - env(safe-area-inset-bottom, 0px));
      overflow: auto;
      padding: 22px;
      border: 1px solid var(--page-border);
      border-radius: 12px;
      background: var(--page-surface);
      color: var(--page-text);
    }
    .toast {
      position: fixed;
      left: 50%;
      bottom: calc(16px + env(safe-area-inset-bottom, 0px));
      z-index: 9000;
      width: min(420px, calc(100vw - 24px));
      padding: 12px 14px;
      border: 1px solid var(--page-border);
      border-radius: 8px;
      background: var(--page-surface);
      color: var(--page-text);
      box-shadow: 0 8px 24px rgba(15, 29, 54, .18);
      transform: translateX(-50%);
    }
    .toast[hidden] { display: none; }
    @media (max-width: 640px) {
      .page-wrap { width: min(100% - 24px, 560px); padding-top: 16px; }
      .page-intro { display: block; }
      .page-intro .actions { margin-top: 14px; }
      .surface { padding: 16px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; }
    }
  </style>
</head>
<body>
  <!-- 3. Shared shell: keep the home link and page identity predictable. -->
  <header class="topbar" id="topbar">
    <a class="ft-back-link" href="../index.html" aria-label="Back to Field Tools Hub"><span class="topbar-back-label">Home</span></a>
    <span class="ft-topbar-div" aria-hidden="true"></span>
    <strong>TODO TOOL NAME</strong>
    <span class="ft-topbar-spacer" aria-hidden="true"></span>
    <button class="ft-help-btn" id="help-button" type="button" aria-label="How to use TODO TOOL NAME">?</button>
  </header>

  <main class="page-wrap">
    <!-- 4. Page content: replace the TODO content without changing the shell contracts. -->
    <section class="page-intro" aria-labelledby="page-title">
      <div>
        <p class="ft-eyebrow">TODO CATEGORY</p>
        <h1 id="page-title">TODO Page title</h1>
        <p>TODO One-sentence task explanation and important source/status note.</p>
      </div>
      <div class="actions">
        <button class="button button-primary" type="button" id="primary-action">TODO Primary action</button>
        <button class="button" type="button" id="secondary-action">TODO Secondary</button>
      </div>
    </section>

    <section class="surface" aria-labelledby="content-heading">
      <h2 id="content-heading">TODO Main section</h2>
      <p id="status" role="status">TODO Loading, empty, success, or current-state copy.</p>
      <div class="field">
        <label for="todo-input">TODO Field label</label>
        <input id="todo-input" type="text" autocomplete="off">
      </div>
    </section>
  </main>

  <!-- 5. Accessible help dialog. Keep aria-hidden synchronized with visibility. -->
  <div class="dialog-backdrop" id="help-dialog" role="dialog" aria-modal="true"
       aria-labelledby="help-dialog-title" aria-hidden="true">
    <section class="dialog">
      <h2 id="help-dialog-title">How to use TODO TOOL NAME</h2>
      <p>TODO Short, field-oriented instructions and limitations.</p>
      <button class="button button-primary" id="close-help" type="button">Got it</button>
    </section>
  </div>
  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

  <script>
    /* 6. Minimal page behavior and safe transition cleanup. */
    (function () {
      'use strict';
      var helpButton = document.getElementById('help-button');
      var helpDialog = document.getElementById('help-dialog');
      var closeHelp = document.getElementById('close-help');
      var toast = document.getElementById('toast');
      var toastTimer = null;
      var lastFocused = null;

      function openHelp() {
        lastFocused = document.activeElement;
        helpDialog.setAttribute('aria-hidden', 'false');
        closeHelp.focus();
      }
      function closeHelpDialog() {
        helpDialog.setAttribute('aria-hidden', 'true');
        if (lastFocused && typeof lastFocused.focus === 'function') lastFocused.focus();
      }
      function showToast(message) {
        toast.textContent = message;
        toast.hidden = false;
        clearTimeout(toastTimer);
        toastTimer = setTimeout(function () { toast.hidden = true; }, 3200);
      }
      helpButton.addEventListener('click', openHelp);
      closeHelp.addEventListener('click', closeHelpDialog);
      helpDialog.addEventListener('click', function (event) {
        if (event.target === helpDialog) closeHelpDialog();
      });
      document.addEventListener('keydown', function (event) {
        if (event.key === 'Escape' && helpDialog.getAttribute('aria-hidden') === 'false') {
          closeHelpDialog();
        }
      });
      document.getElementById('primary-action').addEventListener('click', function () {
        showToast('TODO Replace this confirmation with the real result.');
      });

      window.addEventListener('pageshow', function () {
        document.documentElement.classList.remove('is-exiting', 'is-entering');
        document.body.style.removeProperty('opacity');
        document.body.style.removeProperty('transform');
      });
    }());
  </script>
</body>
</html>
